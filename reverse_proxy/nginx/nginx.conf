events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimize file sending and timeouts
    sendfile        on;
    keepalive_timeout 65;

    upstream backend_upstream {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Increase max upload/request body size if needed for payloads
        client_max_body_size 20M;

        location / {
            proxy_pass http://backend_upstream;

            # HTTP version 1.1 required for keepalive connections and proper proxying
            proxy_http_version 1.1;

            # Forward headers so Spring Boot knows the real client info and original host
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Prevent connection drop issues with POST requests
            proxy_set_header Connection "";
            
            # Optional: disable buffering for real-time streams if applicable
            proxy_buffering off;
        }
    }
}