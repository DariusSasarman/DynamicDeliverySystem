spring:
  application:
    name: dynamic-delivery-system
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:delivery_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:delivery_user}
    password: ${DB_PASSWORD:delivery_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dynamic-delivery-system-development-secret-key-change-me}
      expiration-minutes: 240
